services:
  postgres:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    ports: ["5432:5432"]
    volumes: [event-sourcing-account-data:/var/lib/postgresql/data]
    networks: [account-net]

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["8088:80"]
    networks: [account-net]

volumes:
  event-sourcing-account-data:
networks:
  account-net: